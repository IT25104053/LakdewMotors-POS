# Project Name-Lakdew POS
spring.application.name=pos-backend

# MySQL Database Connection
# This creates a completely separate database named 'lakdew_pos_db' so it won't touch your old one
spring.datasource.url=jdbc:mysql://localhost:3306/lakdew_pos_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration (Auto-creates tables from our Java code)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
